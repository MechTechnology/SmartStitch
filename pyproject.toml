[project]
name = "SmartStitch"
version = "3.2.0"
description = "A program for stitching and cutting webtoons/manhwa/manhua raws"
requires-python = ">=3.10"
dependencies = [
    "natsort",
    "pillow",
    "numpy",
    "pyside6",
    "pyqtdarktheme",
    "psd-tools>=1.10.13",
]

[project.optional-dependencies]
dev = [
    "flake8",
    "black",
    "isort",
    "pyinstaller",
]

[dependency-groups]
dev = [
    "flake8",
    "black",
    "isort",
    "pyinstaller",
    "taskipy",
]

[project.scripts]
gui = "SmartStitchGUI:launch"

[tool.taskipy.tasks]
black = "black ."
format = "python -m scripts.formatter"
console = "python -m SmartStitchConsole"
gui = "python -m SmartStitchGUI"
build = "pyinstaller Build.spec"
build-no-icon = "pyinstaller BuildNoIcon.spec"

[tool.black]
line-length = 120
target-version = ["py310"]
skip-string-normalization = true

[tool.isort]
profile = "black"
line_length = 120
